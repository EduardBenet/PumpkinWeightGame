[package]
name = "pumpkin-weight"
version = "0.1.0"
edition = "2024"
license = "MIT"

default-run = "gui"

[dependencies]
dialoguer = "0.12.0"
eframe = { version = "0.36.2", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
egui_extras = { version = "0.36", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[lints.clippy]
redundant_field_names = "allow"

[profile.release]
# Drop the symbol table: a much smaller binary and a faster link, which
# matters on a Pi. Comment out when you need names in a backtrace.
strip = true
